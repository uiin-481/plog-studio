<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plog 手账工坊 · 自由画纸拼贴创作台</title>
<link rel="stylesheet" href="plog-studio.css">
</head>
<body>
<div id="plogApp" class="plog-app">
 <header class="plog-topbar">
  <div class="plog-brand">
   <span class="plog-logo">✦</span>
   <div><b id="projectTitle">我的 Plog</b><small>自由画纸 · 拼贴工坊</small></div>
   <button type="button" id="openProjectsBtn" class="ghost-btn" title="新建或切换不同的 Plog 作品集">📚 作品集</button>
  </div>

  <div class="plog-tools" role="toolbar" aria-label="编辑工具">
   <button type="button" id="addPhoto" class="accent-btn">＋ 图片</button>
   <button type="button" id="addText">＋ 文字</button>
   <button type="button" id="addShape">＋ 色块</button>
   <span class="sep"></span>
   <button type="button" id="undo" title="撤销 Ctrl+Z">↶</button>
   <button type="button" id="redo" title="重做 Ctrl+Y">↷</button>
   <button type="button" id="duplicateEl" title="复制 Ctrl+D">⧉ 复制</button>
   <button type="button" id="deleteEl" title="删除 Delete">⌫ 删除</button>
   <span class="sep"></span>
   <button type="button" id="importFont" title="导入本地字体文件">Aa 字体</button>
  </div>

  <div class="plog-size-bar" aria-label="画纸尺寸设置">
   <label>画纸
    <select id="paperPreset">
     <option value="1080x1440" selected>小红书 3:4 (1080×1440)</option>
     <option value="1080x1920">手机长图 9:16 (1080×1920)</option>
     <option value="1200x1200">正方形 1:1 (1200×1200)</option>
     <option value="1440x1080">横版 4:3 (1440×1080)</option>
     <option value="880x1180">摄影书页 (880×1180)</option>
     <option value="custom">自定义尺寸</option>
    </select>
   </label>
   <div class="size-inputs">
    <input type="number" id="paperW" min="300" max="2400" step="10" value="1080" aria-label="画纸宽度">
    <span>×</span>
    <input type="number" id="paperH" min="300" max="3200" step="10" value="1440" aria-label="画纸高度">
   </div>
  </div>

  <div class="plog-actions">
   <select id="exportFormat" aria-label="导出格式" title="导出图片格式">
    <option value="png" selected>PNG</option>
    <option value="jpeg">JPG</option>
   </select>
   <select id="exportScale" aria-label="导出倍率" title="导出清晰度倍率">
    <option value="1" selected>1×</option>
    <option value="1.5">1.5×</option>
    <option value="2">2×</option>
   </select>
   <button type="button" id="exportPageBtn" class="primary-btn">🖼 导出当前页</button>
  </div>
 </header>

 <div class="plog-body">
  <aside class="plog-left">
   <div class="panel-head">
    <strong>页面列表</strong>
    <small id="pageCountLabel">1 页</small>
   </div>
   <div id="pageList" class="page-list"></div>
   <div class="page-actions">
    <button type="button" id="addPageBtn" class="accent-btn">＋ 新建页</button>
    <div class="row2">
     <button type="button" id="dupPageBtn">复制页</button>
     <button type="button" id="delPageBtn">删除页</button>
    </div>
   </div>
   <div class="backup-bar">
    <button type="button" id="exportJsonBtn" title="导出工程 JSON 备份">↓ 备份 JSON</button>
    <button type="button" id="importJsonBtn" title="从 JSON 恢复工程">↑ 导入 JSON</button>
   </div>
  </aside>

  <main class="plog-center">
   <div class="canvas-meta">
    <span id="pageLabel">第 1 页</span>
    <span id="canvasDimLabel">画纸 · 1080 × 1440</span>
    <span class="hint">支持图片描边、手撕纸边、滤镜、抠图；双击图片可快速编辑</span>
   </div>
   <div class="canvas-stage">
    <div class="canvas-wrap"><canvas id="editCanvas" width="1080" height="1440"></canvas></div>
   </div>
   <div class="status-bar"><span id="statusText">已就绪 · 自动保存于本机浏览器</span></div>
  </main>

  <aside class="plog-right">
   <div class="right-tabs">
    <button type="button" class="right-tab active" data-tab="props">底色与属性</button>
    <button type="button" class="right-tab" data-tab="plog">模板与图案</button>
   </div>
   <section id="propsTab" class="right-scroll">
    <div id="elementProps" class="props-box"></div>
    <div class="layers-head">当前页图层（点击选中 · 可拖动调整顺序）</div>
    <div id="layersList" class="layers-list"></div>
   </section>
   <section id="plogTab" class="right-scroll" hidden>
    <div id="plogLibrary"></div>
   </section>
  </aside>
 </div>
</div>

<input hidden id="photoInput" type="file" multiple accept="image/jpeg,image/png,image/webp,image/avif">
<input hidden id="replacePhotoInput" type="file" accept="image/jpeg,image/png,image/webp,image/avif">
<input hidden id="fontInput" type="file" multiple accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2">
<input hidden id="jsonInput" type="file" accept=".json,application/json">

<script src="plog-studio.js"></script>
</body>
</html>
