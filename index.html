<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plog 手账工坊 · 自由画纸拼贴创作台</title>
<link rel="stylesheet" href="plog-studio.css">
</head>
<body>
<div id="plogApp" class="plog-app">
 <header class="plog-topbar">
  <div class="plog-brand">
   <span class="plog-logo">✦</span>
   <div><b id="projectTitle">我的 Plog</b><small>自由画纸 · 拼贴工坊</small></div>
   <button type="button" id="openProjectsBtn" class="ghost-btn" title="新建或切换不同的 Plog 作品集">📚 作品集</button>
  </div>

  <div class="plog-tools" role="toolbar" aria-label="编辑工具">
   <button type="button" id="addPhoto" class="accent-btn">＋ 图片</button>
   <button type="button" id="addText">＋ 文字</button>
   <button type="button" id="addShape">＋ 色块</button>
   <button type="button" id="doodleToggle" title="自由涂鸦画笔（马克笔 / 荧光笔 / 蜡笔）">✏ 涂鸦</button>
   <button type="button" id="grid9Toggle" title="开启九宫格拼接辅助线与 1:1 正方形画纸">⊞ 九宫格</button>
   <button type="button" id="doubleExpBtn" title="两张照片双重曝光融合（滤色/柔光/柔边擦除）">✦ 双重曝光</button>
   <span class="sep"></span>
   <button type="button" id="undo" title="撤销 Ctrl+Z">↶</button>
   <button type="button" id="redo" title="重做 Ctrl+Y">↷</button>
   <button type="button" id="duplicateEl" title="原地克隆 Ctrl+D">⊕ 克隆</button>
   <button type="button" id="copyEl" title="复制所选图层 Ctrl+C">⧉ 复制</button>
   <button type="button" id="pasteEl" title="粘贴图层到当前画布 Ctrl+V" disabled>📋 粘贴</button>
   <button type="button" id="deleteEl" title="删除 Delete">⌫ 删除</button>
   <button type="button" id="crossSelectBtn" title="跨多个画布勾选任意图层进行复制、移动或汇总">⇄ 跨画布多选</button>
   <span class="sep"></span>
   <button type="button" id="importFont" title="导入本地字体文件">Aa 字体</button>
  </div>

  <div class="plog-size-bar" aria-label="画纸尺寸设置">
   <label>画纸
    <select id="paperPreset">
     <option value="1080x1440" selected>小红书 3:4 (1080×1440)</option>
     <option value="1080x1920">手机长图 9:16 (1080×1920)</option>
     <option value="1800x1800">九宫格拼图 1:1 (1800×1800)</option>
     <option value="2400x2400">九宫格超清 1:1 (2400×2400)</option>
     <option value="3600x3600">九宫格巨幅 1:1 (3600×3600)</option>
     <option value="2400x3200">超大画布 3:4 (2400×3200)</option>
     <option value="1200x1200">正方形 1:1 (1200×1200)</option>
     <option value="1440x1080">横版 4:3 (1440×1080)</option>
     <option value="880x1180">摄影书页 (880×1180)</option>
     <option value="custom">自定义尺寸</option>
    </select>
   </label>
   <div class="size-inputs">
    <input type="number" id="paperW" min="300" max="6000" step="10" value="1080" aria-label="画纸宽度">
    <span>×</span>
    <input type="number" id="paperH" min="300" max="8000" step="10" value="1440" aria-label="画纸高度">
   </div>
  </div>

  <div class="plog-actions">
   <select id="exportFormat" aria-label="导出格式" title="导出图片格式">
    <option value="png" selected>PNG</option>
    <option value="jpeg">JPG</option>
   </select>
   <select id="exportScale" aria-label="导出倍率" title="导出清晰度倍率">
    <option value="1" selected>1×</option>
    <option value="1.5">1.5×</option>
    <option value="2">2×</option>
   </select>
   <button type="button" id="exportGrid9Btn" title="将画布切成 9 张正方形拼接图并预览下载">⊞ 导出九宫格</button>
   <button type="button" id="exportPageBtn" class="primary-btn">🖼 导出当前页</button>
  </div>
 </header>
 <div id="resizerTop" class="panel-resizer-h" title="上下拖动调整顶部工具栏高度（双击收起/展开）"></div>

 <div class="plog-body">
  <aside class="plog-left">
   <div class="panel-head">
    <strong>页面列表</strong>
    <small id="pageCountLabel">1 页</small>
   </div>
   <div id="pageList" class="page-list"></div>
   <div class="page-actions">
    <button type="button" id="addPageBtn" class="accent-btn">＋ 新建页</button>
    <div class="row2">
     <button type="button" id="dupPageBtn">复制页</button>
     <button type="button" id="delPageBtn">删除页</button>
    </div>
    <button type="button" id="crossSelectLeftBtn" title="跨多个画布多选图层">⇄ 跨画布多选</button>
   </div>
   <div class="backup-bar">
    <button type="button" id="exportJsonBtn" title="导出工程 JSON 备份">↓ 备份 JSON</button>
    <button type="button" id="importJsonBtn" title="从 JSON 恢复工程">↑ 导入 JSON</button>
   </div>
  </aside>
  <div id="resizerLeft" class="panel-resizer" title="左右拖动调整页面栏宽度（双击收起/展开）"></div>

  <main class="plog-center">
   <div class="canvas-meta">
    <span id="pageLabel">第 1 页</span>
    <span id="canvasDimLabel">画纸 · 1080 × 1440</span>
    <div class="canvas-zoom" role="group" aria-label="画布缩放">
     <button type="button" id="zoomOut" title="缩小">－</button>
     <span id="zoomLabel">适配</span>
     <button type="button" id="zoomIn" title="放大">＋</button>
     <button type="button" id="zoom100" title="100% 原寸查看">100%</button>
     <button type="button" id="zoomFit" title="恢复适配窗口">适配</button>
    </div>
    <button type="button" id="focusCanvasBtn" class="ghost-btn" title="收起/展开左右侧栏以最大化画布">⤢ 专注画布</button>
    <span class="hint">空白处拖框多选 · Ctrl+C/V 跨画布复制粘贴 · 空格拖动平移 · 双击修图</span>
   </div>
   <div id="doodleBar" class="doodle-bar" hidden>
    <strong>✏ 涂鸦画笔</strong>
    <select id="doodleType" aria-label="画笔类型">
     <option value="marker">马克笔</option>
     <option value="highlighter">荧光笔（半透明）</option>
     <option value="crayon">蜡笔（颗粒质感）</option>
    </select>
    <input type="color" id="doodleColor" value="#e26d5a" title="画笔颜色">
    <div class="doodle-swatches">
     <button type="button" data-dcolor="#2e242c" style="background:#2e242c" title="炭黑"></button>
     <button type="button" data-dcolor="#ffffff" style="background:#ffffff" title="纯白"></button>
     <button type="button" data-dcolor="#ffe066" style="background:#ffe066" title="荧光黄"></button>
     <button type="button" data-dcolor="#f497a9" style="background:#f497a9" title="樱花粉"></button>
     <button type="button" data-dcolor="#7c986e" style="background:#7c986e" title="抹茶绿"></button>
     <button type="button" data-dcolor="#e26d5a" style="background:#e26d5a" title="砖红"></button>
    </div>
    <label>粗细 <span id="doodleSizeVal">14</span><input type="range" id="doodleSize" min="3" max="60" value="14"></label>
    <button type="button" id="doodleDone" class="primary-btn">✓ 完成涂鸦</button>
   </div>
   <div id="grid9Bar" class="grid9-bar" hidden>
    <strong>⊞ 九宫格拼接模式</strong>
    <label>切图缝隙
     <select id="grid9GapSel" aria-label="九宫格切图缝隙">
      <option value="0" selected>无缝直切（0px）</option>
      <option value="18">朋友圈白缝补偿（18px）</option>
      <option value="30">宽松白缝补偿（30px）</option>
     </select>
    </label>
    <button type="button" id="grid9SquareBtn">设为 2400×2400 正方形</button>
    <button type="button" id="grid9ExportBarBtn" class="primary-btn">⊞ 预览并导出 9 张</button>
    <button type="button" id="grid9CloseBtn">关闭辅助线</button>
   </div>
   <div class="canvas-stage">
    <div class="canvas-wrap"><canvas id="editCanvas" width="1080" height="1440"></canvas></div>
   </div>
   <div class="status-bar"><span id="statusText">已就绪 · 自动保存于本机浏览器</span></div>
  </main>

  <div id="resizerRight" class="panel-resizer" title="左右拖动调整右侧栏宽度（双击收起/展开）"></div>
  <aside class="plog-right">
   <div class="right-tabs">
    <button type="button" class="right-tab active" data-tab="props">底色与属性</button>
    <button type="button" class="right-tab" data-tab="stickers">手帐素材</button>
    <button type="button" class="right-tab" data-tab="plog">模板与布局</button>
   </div>
   <section id="propsTab" class="right-scroll">
    <div id="elementProps" class="props-box"></div>
    <div class="layers-head">当前页图层（点击选中）</div>
    <div id="layersList" class="layers-list"></div>
   </section>
   <section id="stickersTab" class="right-scroll" hidden>
    <div class="sticker-toolbar">
     <input type="search" id="stickerSearch" placeholder="搜索 309 件原版手帐素材…" aria-label="搜索手帐素材">
     <button type="button" id="importStickerBtn" class="accent-btn">＋ 导入贴纸</button>
    </div>
    <div id="stickerFolders" class="sticker-folder-bar"></div>
    <div id="stickerGrid" class="sticker-grid"></div>
   </section>
   <section id="plogTab" class="right-scroll" hidden>
    <div id="plogLibrary"></div>
   </section>
  </aside>
 </div>
</div>

<input hidden id="photoInput" type="file" multiple accept="image/jpeg,image/png,image/webp,image/avif">
<input hidden id="stickerInput" type="file" multiple accept="image/png,image/webp,image/jpeg,image/svg+xml">
<input hidden id="replacePhotoInput" type="file" accept="image/jpeg,image/png,image/webp,image/avif">
<input hidden id="fontInput" type="file" multiple accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2">
<input hidden id="jsonInput" type="file" accept=".json,application/json">

<script src="plog-studio.js"></script>
</body>
</html>
